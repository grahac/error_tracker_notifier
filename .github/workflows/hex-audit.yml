name: Hex audit

on:
  pull_request:
    paths:
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/hex-audit.yml"
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20.2"
      - run: mix local.hex --force
      - run: mix hex.audit
